<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Contact Message - Unchain Summer</title>

    <style>
      @media only screen and (max-width: 600px) {
        .outer-table {
          padding: 0 !important;
        }
        .card {
          width: 100% !important;
          border-radius: 0 !important;
        }
        .body-pad {
          padding: 32px 20px !important;
        }
      }
    </style>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont,
        'Helvetica Neue', Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    "
  >
    <!-- Outer wrapper -->
    <table
      class="outer-table"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      role="presentation"
      style="background-color: #f4f4f4; padding: 40px 16px"
    >
      <tr>
        <td align="center" valign="top">
          <table
            class="card"
            width="600"
            cellpadding="0"
            cellspacing="0"
            role="presentation"
            style="max-width: 600px; width: 100%; border-radius: 8px"
          >
            <!-- ── DARK HEADER ────────────────────────────────────── -->
            <tr>
              <td
                style="
                  background-color: #1d1d1d;
                  padding: 28px 40px;
                  border-radius: 8px 8px 0 0;
                "
              >
                <p
                  style="
                    margin: 0 0 6px;
                    font-size: 11px;
                    font-weight: 700;
                    color: #6ec93e;
                    text-transform: uppercase;
                    letter-spacing: 1.5px;
                  "
                >
                  Unchain Summer 2026
                </p>
                <h1
                  style="
                    margin: 0;
                    font-size: 22px;
                    font-weight: 600;
                    color: #ffffff;
                    line-height: 1.4;
                  "
                >
                  New message from the site
                </h1>
              </td>
            </tr>

            <!-- ── WHITE BODY ─────────────────────────────────────── -->
            <tr>
              <td
                class="body-pad"
                style="background-color: #ffffff; padding: 40px"
              >
                <!-- Sender details -->
                <table
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  role="presentation"
                  style="
                    background-color: #f4f4f4;
                    border-radius: 8px;
                    margin-bottom: 28px;
                  "
                >
                  <tr>
                    <td style="padding: 24px">
                      <!-- Name -->
                      <table
                        width="100%"
                        cellpadding="0"
                        cellspacing="0"
                        role="presentation"
                        style="margin-bottom: 16px"
                      >
                        <tr>
                          <td
                            style="
                              font-size: 11px;
                              font-weight: 700;
                              color: #888888;
                              text-transform: uppercase;
                              letter-spacing: 1.5px;
                              width: 90px;
                              vertical-align: top;
                              padding-top: 2px;
                            "
                          >
                            Name
                          </td>
                          <td
                            style="
                              font-size: 15px;
                              font-weight: 600;
                              color: #1a1a1a;
                              line-height: 1.5;
                            "
                          >
                            {{name}}
                          </td>
                        </tr>
                      </table>
                      <!-- Email -->
                      <table
                        width="100%"
                        cellpadding="0"
                        cellspacing="0"
                        role="presentation"
                        style="margin-bottom: 16px"
                      >
                        <tr>
                          <td
                            style="
                              font-size: 11px;
                              font-weight: 700;
                              color: #888888;
                              text-transform: uppercase;
                              letter-spacing: 1.5px;
                              width: 90px;
                              vertical-align: top;
                              padding-top: 2px;
                            "
                          >
                            Email
                          </td>
                          <td
                            style="
                              font-size: 15px;
                              font-weight: 400;
                              color: #1a1a1a;
                              line-height: 1.5;
                            "
                          >
                            <a
                              href="mailto:{{email}}"
                              style="
                                color: #6ec93e;
                                text-decoration: none;
                                font-weight: 600;
                              "
                              >{{email}}</a
                            >
                          </td>
                        </tr>
                      </table>
                      <!-- Subject -->
                      <table
                        width="100%"
                        cellpadding="0"
                        cellspacing="0"
                        role="presentation"
                        style="margin-bottom: 16px"
                      >
                        <tr>
                          <td
                            style="
                              font-size: 11px;
                              font-weight: 700;
                              color: #888888;
                              text-transform: uppercase;
                              letter-spacing: 1.5px;
                              width: 90px;
                              vertical-align: top;
                              padding-top: 2px;
                            "
                          >
                            Subject
                          </td>
                          <td
                            style="
                              font-size: 15px;
                              font-weight: 600;
                              color: #1a1a1a;
                              line-height: 1.5;
                            "
                          >
                            {{subject}}
                          </td>
                        </tr>
                      </table>
                      <!-- X Handle (conditional — remove row if not provided) -->
                      <table
                        width="100%"
                        cellpadding="0"
                        cellspacing="0"
                        role="presentation"
                      >
                        <tr>
                          <td
                            style="
                              font-size: 11px;
                              font-weight: 700;
                              color: #888888;
                              text-transform: uppercase;
                              letter-spacing: 1.5px;
                              width: 90px;
                              vertical-align: top;
                              padding-top: 2px;
                            "
                          >
                            X Handle
                          </td>
                          <td
                            style="
                              font-size: 15px;
                              font-weight: 400;
                              color: #1a1a1a;
                              line-height: 1.5;
                            "
                          >
                            {{x_handle}}
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>

                <!-- Message body -->
                <p
                  style="
                    margin: 0 0 10px;
                    font-size: 11px;
                    font-weight: 700;
                    color: #888888;
                    text-transform: uppercase;
                    letter-spacing: 1.5px;
                  "
                >
                  Message
                </p>
                <table
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  role="presentation"
                >
                  <tr>
                    <td
                      style="
                        background-color: #f9fff5;
                        border-left: 4px solid #6ec93e;
                        border-radius: 0 8px 8px 0;
                        padding: 20px 24px;
                      "
                    >
                      <p
                        style="
                          margin: 0;
                          font-size: 15px;
                          font-weight: 400;
                          color: #1a1a1a;
                          line-height: 1.75;
                          white-space: pre-wrap;
                        "
                      >
                        {{message}}
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- ── DARK FOOTER ───────────────────────────────────── -->
            <tr>
              <td
                style="
                  background-color: #1d1d1d;
                  border-radius: 0 0 8px 8px;
                  padding: 24px 40px;
                  text-align: center;
                "
              >
                <p
                  style="
                    margin: 0 0 6px;
                    font-size: 12px;
                    color: rgba(255, 255, 255, 0.65);
                    line-height: 1.8;
                  "
                >
                  &copy; {{year}} NFTNG &nbsp;&middot;&nbsp; Unchain Summer
                  2026 &nbsp;&middot;&nbsp; Lagos, Nigeria
                </p>
                <p
                  style="
                    margin: 0;
                    font-size: 11px;
                    color: rgba(255, 255, 255, 0.35);
                    line-height: 1.7;
                    font-style: italic;
                  "
                >
                  Sent via the contact form on unchainsummer.nftng.io
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
